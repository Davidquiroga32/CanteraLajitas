name: Pruebas

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        base: [sqlite, mysql]

    name: PHP 8.5 · ${{ matrix.base }}

    # MySQL es la base de datos del servidor, así que las pruebas también corren con ella.
    # El usuario y la clave son solo de este contenedor de pruebas.
    services:
      mysql:
        image: ${{ matrix.base == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: pruebas
          MYSQL_DATABASE: cantera_pruebas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppruebas"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.base }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${{ matrix.base == 'mysql' && 'cantera_pruebas' || ':memory:' }}
      DB_USERNAME: root
      DB_PASSWORD: pruebas

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test --exclude-group=concurrencia

      - name: Dos operaciones del mismo comprador al tiempo (solo MySQL)
        if: matrix.base == 'mysql'
        run: php artisan test --group=concurrencia
