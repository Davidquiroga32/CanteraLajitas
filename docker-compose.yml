services:
  mysql:
    image: mysql:8.4
    container_name: cantera_lajitas_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cantera_lajitas
      MYSQL_USER: cantera
      MYSQL_PASSWORD: cantera_secret
      MYSQL_ROOT_PASSWORD: root_secret
      TZ: America/Bogota
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
